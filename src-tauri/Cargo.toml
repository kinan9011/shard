[package]
name = "shard"
version = "1.0.0"
description = "Shard - Your Essential Developer Companion"
authors = ["kinan9011"]
license = "MIT"
repository = "https://github.com/kinan9011/shard"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-deep-link = "=2.6.1"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "=2.4.1"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = { version = "=2.5.2", features = ["deep-link"] }
tauri-plugin-updater = "2"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
# Same crate and provider the updater uses; plugin_fetch installs it when nothing else has.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
url = "2"
# Already in the lock through the updater. Deflate only: plugin packages are plain zips.
zip = { version = "4.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3"

[features]
# Test-only behaviour for the end-to-end smoke test. Release builds never enable it.
e2e = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
